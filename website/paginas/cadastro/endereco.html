<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="../../estilo/cadastro.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../imagens/FullTechIcon.png">
    <title>Cadastro</title>
</head>
<body>
     <div class="container">
        <div class="esquerda">
            <img src="../../../imagens/FullTechIcon.png" class="icon">
        </div>
        <div class="direita">
        <form>
            <h1 class="titulo">
                Informe seu Endereço
            </h1>
            <div class="linha">
                <input type="text" maxlength="8" minlength="8" placeholder="CEP">
                <input type="text" maxlength="2" minlength="2" placeholder="Estado">
            </div>

            <div class="linha">
                <input type="text" placeholder="Cidade">
                <input type="text" placeholder="Número">
            </div>

            <div class="linha">
                <input type="text" placeholder="Bairro" class="input-grande">
            </div>

            <a href="../contato/contato.html">Precisa de ajuda? Contate o suporte!</a>

            <button type="submit">
                <a href="./cadastrocontato.html">Próximo</a>
            </button>
        </form>
        </div>
     </div>
</body>
</html>
